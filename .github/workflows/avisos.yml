# Llama cada hora a la función de recordatorios para que los avisos lleguen a su hora.
name: Avisos cada hora
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 60 https://nuestrascartas.vercel.app/api/cron
