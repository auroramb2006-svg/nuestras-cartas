# Llama cada hora a la función de recordatorios para que los avisos lleguen a su hora.
name: Avisos cada hora
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - run: curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" https://nuestrascartas.vercel.app/api/cron
